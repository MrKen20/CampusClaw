# CampusClaw 迭代 1：web + api + db 三容器，仅 web 映射宿主端口。
# 启动：cp .env.example .env → 填写密钥 → docker compose up --build -d
services:
  db:
    image: mysql:8.0
    # root 口令随机生成、无人持有；api 只使用下面的普通账号（design.md「配置与启动」）
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "true"
      MYSQL_DATABASE: ${MYSQL_DATABASE:?请在 .env 中填写 MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER:?请在 .env 中填写 MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中填写 MYSQL_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
    # 不映射端口：仅在 Compose 内部网络可达（攻击面最小化）
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      SESSION_SECRET: ${SESSION_SECRET:?请在 .env 中填写 SESSION_SECRET}
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      SEED_TEACHER_PASSWORD: ${SEED_TEACHER_PASSWORD:?请在 .env 中填写 SEED_TEACHER_PASSWORD}
      SEED_STUDENT_PASSWORD: ${SEED_STUDENT_PASSWORD:?请在 .env 中填写 SEED_STUDENT_PASSWORD}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-1048576}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-24}
      LOGIN_FAIL_LIMIT: ${LOGIN_FAIL_LIMIT:-5}
      LOGIN_FAIL_WINDOW_SECONDS: ${LOGIN_FAIL_WINDOW_SECONDS:-300}
      UPLOAD_DIR: /app/uploads
      API_PORT: "8081"
      # 第 4 课：嵌入/对话网关与 Qdrant（密钥只经环境变量注入，缺失即启动失败）
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:?请在 .env 中填写 EMBEDDING_BASE_URL}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:?请在 .env 中填写 EMBEDDING_API_KEY}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-course-embedding}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-2048}
      CHAT_BASE_URL: ${CHAT_BASE_URL:?请在 .env 中填写 CHAT_BASE_URL}
      CHAT_API_KEY: ${CHAT_API_KEY:?请在 .env 中填写 CHAT_API_KEY}
      CHAT_MODEL: ${CHAT_MODEL:-course-chat}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      CHUNK_AUTO_MAX_CHARS: ${CHUNK_AUTO_MAX_CHARS:-800}
      CHUNK_AUTO_OVERLAP: ${CHUNK_AUTO_OVERLAP:-80}
      VECTOR_SCORE_THRESHOLD: ${VECTOR_SCORE_THRESHOLD:-0.25}
      RRF_K: ${RRF_K:-60}
      ASK_TOP_K: ${ASK_TOP_K:-4}
    volumes:
      - uploads:/app/uploads
    depends_on:
      - db
      - qdrant
    # 不单独暴露端口：只经 web 反代访问；应用自身会重试等待 db 就绪（design.md D4）
    restart: unless-stopped

  # Qdrant 向量库：仅 Compose 内部网络可达，不映射宿主端口（design.md D4）
  qdrant:
    image: qdrant/qdrant:v1.11.3
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  dbdata:
  uploads:
  qdrant_data:
